
name: Build Donut Client

on:
  workflow_dispatch:
  push:
    paths:
      - "DonutClient-26.2-source.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Extract source ZIP
        run: unzip DonutClient-26.2-source.zip

      - name: Build mod
        working-directory: DonutClient-26.2
        run: gradle build --no-daemon

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: DonutClient-JAR
          path: DonutClient-26.2/build/libs/*.jar
          if-no-files-found: error
